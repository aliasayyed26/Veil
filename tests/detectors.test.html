<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veil — In-Browser Acceptance Tests</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #060a14;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(16, 26, 48, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 20px 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.35rem;
    }
    .summary {
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.8);
    }
    .summary.pass { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    .summary.fail { color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }
    li {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(7, 12, 24, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.14);
      font-size: 0.92rem;
    }
    li.pass { border-left: 4px solid #34d399; }
    li.fail { border-left: 4px solid #f87171; color: #fecaca; }
  </style>
  <script defer src="../src/detectors.js"></script>
  <script defer src="../src/redact.js"></script>
  <script defer src="../src/audit.js"></script>
  <script defer src="../src/export.js"></script>
  <script defer src="../src/sample.js"></script>
  <script defer src="tests.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>Veil — In-Browser Acceptance Test Suite</h1>
    <div id="testSummary" class="summary">Running tests...</div>
    <ul id="testList"></ul>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', async function () {
      const summaryEl = document.getElementById('testSummary');
      const listEl = document.getElementById('testList');
      const report = await window.VeilTests.runAllTestsAsync();

      summaryEl.textContent = report.passed + ' / ' + report.total + ' tests passed' + (report.failed ? ' (' + report.failed + ' failed)' : '');
      summaryEl.className = 'summary ' + (report.failed === 0 ? 'pass' : 'fail');

      const fragment = document.createDocumentFragment();
      for (let i = 0; i < report.results.length; i++) {
        const item = report.results[i];
        const li = document.createElement('li');
        li.className = item.pass ? 'pass' : 'fail';
        li.textContent = (item.pass ? 'PASS: ' : 'FAIL: ') + item.name + (item.error ? ' — ' + item.error : '');
        fragment.appendChild(li);
      }
      listEl.replaceChildren(fragment);
    });
  </script>
</body>
</html>
